<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório A/B</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f5f5f6; --card:#ffffff; --ink:#1b1b1f; --muted:#5d5d66; --line:#dcdce2;
  --mag:#ed145b; --mag-soft:#fde3ec; --a:#4a6fa5; --b:#e8761c; --ok:#1d8a4e; --ok-soft:#e3f4ea;
  --warn:#b26a00; --warn-soft:#fff2dc; --bad:#c0263b; --bad-soft:#fbe4e7; --band:rgba(237,20,91,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.45}
header{background:#111;color:#fff;padding:14px 16px}
header .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header b{font-size:17px;letter-spacing:.2px}
header b span{color:var(--mag)}
header small{color:#bbb;font-size:13px}
main{padding:16px}
.wrap{max-width:780px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
h1{font-size:22px;margin:4px 0 8px}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mag{color:var(--mag);font-weight:bold}
.btn{appearance:none;border:0;border-radius:8px;background:var(--mag);color:#fff;font:bold 16px Arial,Helvetica,sans-serif;padding:12px 18px;cursor:pointer;min-height:46px}
.btn:disabled{background:#c9c9cf;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.letters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.letters button{font:bold 24px Arial;padding:16px 0;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.letters button:hover{border-color:var(--mag);color:var(--mag)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:bold}
td.num,th.num{text-align:right;white-space:nowrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;background:#fff}
.opt input{margin-top:4px;accent-color:var(--mag);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--mag);background:var(--mag-soft)}
.opt b{display:block}
.progress{height:8px;background:#e8e8ec;border-radius:99px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--mag)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .lab{font-size:13px;color:var(--muted);font-weight:bold}
.kpi .val{font-size:26px;font-weight:bold}
.kpi.a .val{color:var(--a)} .kpi.b .val{color:var(--b)}
.tool{border-radius:10px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tool .big{font-size:22px;font-weight:bold}
.tool.ok{background:var(--ok-soft)} .tool.ok .big{color:var(--ok)}
.tool.bad{background:var(--bad-soft)} .tool.bad .big{color:var(--bad)}
.tool.neu{background:#eef0f4}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:bold;background:#eee}
.boss{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0}
.boss .who{font-weight:bold;color:var(--warn);font-size:13px;text-transform:uppercase;letter-spacing:.4px}
textarea{width:100%;min-height:70px;font:15px Arial,Helvetica,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:middle;border-radius:2px}
.verdict{border-radius:10px;padding:14px;margin:10px 0}
.verdict.g{background:var(--ok-soft)} .verdict.p{background:var(--bad-soft)} .verdict.f{background:var(--warn-soft)}
.verdict .big{font-size:22px;font-weight:bold}
.tag{font-size:12px;font-weight:bold;border-radius:6px;padding:2px 6px;white-space:nowrap}
.tag.good{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
footer{max-width:780px;margin:6px auto 30px;padding:0 16px;color:var(--muted);font-size:12px}
.grid6{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.hidden{display:none}
@media (max-width:420px){.kpi .val{font-size:22px}.tool .big{font-size:19px}h1{font-size:20px}}
</style>
</head>

const DECISIONS = [
  {id: 'adotar', t: 'Parar e adotar B', d: 'Encerrar o teste e levar a versão nova para todos.'},
  {id: 'continuar', t: 'Continuar', d: 'Deixar o teste rodando até a próxima rodada.'},
  {id: 'descartar', t: 'Descartar B', d: 'Encerrar o teste e ficar com a versão atual (ou corrigir e repetir).'}
];

/* ---------- estatística (o aluno não calcula; a ferramenta mostra) ---------- */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
function ncdf(z){return 0.5*(1+erf(z/Math.SQRT2))}
function cum(k, d){const r=[0,0,0,0,0,0];for(let i=0;i<d;i++){for(let j=0;j<6;j++)r[j]+=DATA[k][i][j]}return r}
function stats(k, d, from){
  let r;
  if(from){const a=cum(k,d),b=cum(k,from);r=a.map((v,i)=>v-b[i])}else r=cum(k,d);
  const [ta,ca,tb,cb,qa,qb]=r;const pa=ca/ta,pb=cb/tb;
  const se=Math.sqrt(pa*(1-pa)/ta+pb*(1-pb)/tb);const z=(pb-pa)/se;const p=2*(1-ncdf(Math.abs(z)));
  return {ta,ca,tb,cb,pa,pb,lift:pb/pa-1,lo:(pb-pa-1.96*se)/pa,hi:(pb-pa+1.96*se)/pa,sig:1-p,
    split:ta/(ta+tb),qa:qa/ta*1000,qb:qb/tb*1000};
}
const pct=(x,dig=1)=>(x*100).toLocaleString('pt-BR',{minimumFractionDigits:dig,maximumFractionDigits:dig})+'%';
const sgn=(x,dig=1)=>(x>0?'+':x<0?'−':'')+pct(Math.abs(x),dig);
const dec1=x=>(Math.round(x*10)/10).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const int=x=>Math.round(x).toLocaleString('pt-BR');
const sigTxt=s=>s>0.999?'> 99,9%':pct(s,0);
function status(s){
  if(s.sig>=0.95&&s.lift>0)return {cls:'ok',txt:'B à frente',sub:'diferença significativa'};
  if(s.sig>=0.95&&s.lift<0)return {cls:'bad',txt:'B atrás',sub:'diferença significativa'};
  return {cls:'neu',txt:'Inconclusivo',sub:'a diferença ainda pode ser acaso'};
}

/* ---------- gráfico ---------- */
function chart(k, upto, opts={}){
  const W=480,H=300,L=50,R=10,T=18,B=44;const days=[];for(let d=2;d<=upto;d++)days.push(d);
  const pts=days.map(d=>({d,...stats(k,d)}));
  let ymin=-0.3,ymax=0.4;
  const x=d=>L+(d-1)/(LAST-1)*(W-L-R);const y=v=>T+(ymax-Math.max(ymin,Math.min(ymax,v)))/(ymax-ymin)*(H-T-B);
  let g='';
  for(let v=-0.3;v<=0.401;v+=0.1){const vv=Math.round(v*10)/10;g+=`<line x1="${L}" x2="${W-R}" y1="${y(vv)}" y2="${y(vv)}" stroke="${vv===0?'#888':'#e3e3e8'}" stroke-width="${vv===0?1.5:1}"/>`;
    g+=`<text x="${L-8}" y="${y(vv)+4}" font-size="14" text-anchor="end" fill="#666">${vv>0?'+':''}${Math.round(vv*100)}%</text>`}
  for(let d=7;d<=LAST;d+=7){g+=`<line x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H-B}" stroke="#f0f0f3"/><text x="${x(d)}" y="${H-B+18}" font-size="14" text-anchor="middle" fill="#666">${d}</text>`}
  g+=`<text x="${x(1)}" y="${H-B+18}" font-size="14" text-anchor="middle" fill="#666">1</text>`;
  if(opts.deadline){g+=`<line x1="${x(opts.deadline)}" x2="${x(opts.deadline)}" y1="${T}" y2="${H-B}" stroke="#ed145b" stroke-dasharray="5 4" stroke-width="2"/><text x="${x(opts.deadline)-4}" y="${T+12}" font-size="14" text-anchor="end" fill="#ed145b" font-weight="bold">prazo</text>`}
  const band='M'+pts.map(p=>`${x(p.d)},${y(p.hi)}`).join('L')+'L'+pts.slice().reverse().map(p=>`${x(p.d)},${y(p.lo)}`).join('L')+'Z';
  g+=`<path d="${band}" fill="rgba(232,118,28,.18)"/>`;
  g+=`<path d="M${pts.map(p=>`${x(p.d)},${y(p.lift)}`).join('L')}" fill="none" stroke="#e8761c" stroke-width="3"/>`;
  if(opts.today){const p=pts[pts.length-1];g+=`<circle cx="${x(p.d)}" cy="${y(p.lift)}" r="5.5" fill="#e8761c" stroke="#fff" stroke-width="2"/><text x="${x(p.d)+8}" y="${y(p.lift)-8}" font-size="15" font-weight="bold" fill="#1b1b1f">hoje</text>`}
  if(opts.truth!==undefined){g+=`<line x1="${L}" x2="${W-R}" y1="${y(opts.truth)}" y2="${y(opts.truth)}" stroke="#1d8a4e" stroke-width="2" stroke-dasharray="2 4"/>`}
  g+=`<text x="${L}" y="${H-6}" font-size="14" fill="#666">dia do teste</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico do ganho acumulado de B sobre A">${g}</svg>`;
}
function weekly(k, upto){
  const weeks=Math.floor(upto/7);if(weeks<1)return '<p class="small muted">O ganho de cada semana aparece quando a 1ª semana fechar.</p>';
  let rows='';for(let w=1;w<=weeks;w++){const s=stats(k,w*7,(w-1)*7);rows+=`<tr><td>Semana ${w}</td><td class="num">${sgn(s.lift)}</td><td class="num">${dec1(s.qa)} × ${dec1(s.qb)}</td></tr>`}
  return `<table><tr><th>Só a semana</th><th class="num">Ganho de B</th><th class="num">Reclamações A × B</th></tr>${rows}</table>`;
}

/* ---------- estado ---------- */
let S={k:null,effect:null,round:0,dec:[],why:[]};
function save(){try{localStorage.setItem('labab',JSON.stringify(S))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('labab'));if(v&&v.k&&DATA[v.k])S=v}catch(e){}}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function go(){save();render();window.scrollTo(0,0)}

function render(){
  if(new URLSearchParams(location.search).has('painel'))return panel();
  if(!S.k)return home();
  if(!S.effect)return setup();
  if(S.round<ROUNDS.length)return round();
  return reveal();
}
function home(){
  app.innerHTML=`<div class="card"><h1>Decidir com o teste rodando</h1>
  <p>Vocês vão acompanhar um teste A/B dia a dia. Em cada rodada, o grupo decide: <b>parar e adotar</b>, <b>continuar</b> ou <b>descartar</b>, e anota por quê.</p>
  <p class="muted">A/B: metade dos clientes, sorteada, vê a versão atual (A); a outra metade vê a nova (B).</p>
  <h3>Toquem na letra que o professor deu ao grupo</h3>
  <div class="letters">${Object.keys(SC).map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S={k:b.dataset.k,effect:null,round:0,dec:[],why:[]};go()});
}
function setup(){
  const sc=SC[S.k];
  app.innerHTML=`<div class="card"><span class="chip">Teste ${S.k}</span>
  <h1>Antes de começar: o prazo</h1>
  <p>${sc.context}</p>
  <p>Hoje <b>10%</b> de quem abre a tela conclui o cadastro. Cerca de <b>2.000 pessoas por dia</b> caem em cada versão (menos no fim de semana).</p>
  <h3>Qual ganho vale a pena detectar?</h3>
  <p class="small muted">Quanto menor o ganho que vocês querem enxergar, mais gente o teste precisa, e mais dias ele leva. Escolham; a tabela dá o prazo.</p>
  ${EFFECTS.map(e=>`<label class="opt" data-e="${e.id}"><input type="radio" name="ef" value="${e.id}"><div><b>${e.label} &nbsp;<span class="muted small">(de ${e.from} para ${e.to})</span></b>
   <span class="small">${e.n} pessoas por versão · <span class="mag">${e.days} dias</span> <span class="muted">(${e.why})</span></span></div></label>`).join('')}
  <p class="small muted">Tabela calculada com 95% de confiança e 80% de poder (a chance de enxergar o ganho, se ele existir). Prazos arredondados para semanas completas, porque segunda não é sábado.</p>
  <div class="row"><span class="spacer"></span><button class="btn" id="ok" disabled>Registrar o prazo e começar</button></div></div>`;
  let ch=null;
  app.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');o.querySelector('input').checked=true;ch=+o.dataset.e;document.getElementById('ok').disabled=false});
  document.getElementById('ok').onclick=()=>{S.effect=ch;go()};
}
function deadline(){return EFFECTS.find(e=>e.id===S.effect).days}
function round(){
  const sc=SC[S.k],i=S.round,d=ROUNDS[i],s=stats(S.k,d),st=status(s),dl=deadline();
  const stopped=S.dec.findIndex(x=>x!=='continuar');
  const after=stopped>=0&&stopped<i;
  app.innerHTML=`<div class="card">
   <div class="row"><span class="chip">Teste ${S.k}</span><span class="chip">Rodada ${i+1} de 4</span><span class="spacer"></span><span class="small muted">prazo combinado: dia ${dl}</span></div>
   <h1>Dia ${d} do teste</h1>
   <div class="progress"><i style="width:${Math.min(100,d/dl*100)}%"></i></div>
   <p class="small muted">${d>=dl?'O prazo combinado já chegou.':`Faltam ${dl-d} dias para o prazo combinado.`}</p>
   ${after?`<div class="boss" style="background:#eef0f4;border-color:#888"><div><div class="who" style="color:#555">Vocês já encerraram no dia ${ROUNDS[stopped]}</div>Veja o que o teste mostraria se tivesse continuado, e decidam de novo como se ainda estivesse rodando.</div></div>`:''}
   <div class="kpis">
    <div class="kpi a"><div class="lab">A · versão atual</div><div class="val">${pct(s.pa,2)}</div><div class="small muted">${int(s.ca)} de ${int(s.ta)} pessoas</div></div>
    <div class="kpi b"><div class="lab">B · versão nova</div><div class="val">${pct(s.pb,2)}</div><div class="small muted">${int(s.cb)} de ${int(s.tb)} pessoas</div></div>
   </div>
   <div class="tool ${st.cls}"><div><div class="small muted">O que a ferramenta diz</div><div class="big">${st.txt}: ${sgn(s.lift)}</div><div class="small">${st.sub}</div></div><span class="spacer"></span>
    <div style="text-align:right"><div class="small muted">Significância</div><div class="big" style="color:inherit">${sigTxt(s.sig)}</div></div></div>
   <p class="small muted">Faixa provável do ganho de B: de ${sgn(s.lo)} a ${sgn(s.hi)}. Significância: quanto a ferramenta confia que a diferença não é acaso; o mercado costuma pedir 95%.</p>
   ${chart(S.k,d,{deadline:dl,today:true})}
   <div class="legend"><span><i style="background:#e8761c"></i>ganho acumulado de B</span><span><i style="background:rgba(232,118,28,.25)"></i>faixa provável</span><span><i style="background:#ed145b"></i>prazo combinado</span></div>
   <h3>Quem entrou e o que não pode piorar</h3>
   <table>
    <tr><th></th><th class="num">A</th><th class="num">B</th></tr>
    <tr><td>Divisão das pessoas <span class="muted small">(planejado: 50/50)</span></td><td class="num">${pct(s.split,0)}</td><td class="num">${pct(1-s.split,0)}</td></tr>
    <tr><td>Guardrail: reclamações no atendimento <span class="muted small">(por mil pessoas)</span></td><td class="num">${dec1(s.qa)}</td><td class="num">${dec1(s.qb)}</td></tr>
   </table>
   <h3>Ganho de cada semana</h3>${weekly(S.k,d)}
   <div class="boss"><div><div class="who">Recado do diretor</div>“${sc.boss[i]}”</div></div>
  </div>
  <div class="card"><h2>Decisão do grupo no dia ${d}</h2>
   ${DECISIONS.map(o=>`<label class="opt" data-d="${o.id}"><input type="radio" name="dc" value="${o.id}"><div><b>${o.t}</b><span class="small muted">${o.d}</span></div></label>`).join('')}
   <p class="small"><b>Por quê?</b> <span class="muted">(o redator anota também no slide de registro)</span></p>
   <textarea id="why" placeholder="Ex.: o que vimos na tela e o que nos faria mudar de ideia"></textarea>
   <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn" id="ok" disabled>${i<3?'Registrar e avançar':'Registrar e ver o que era verdade'}</button></div>
  </div>`;
  let ch=null;
  app.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');o.querySelector('input').checked=true;ch=o.dataset.d;document.getElementById('ok').disabled=false});
  document.getElementById('ok').onclick=()=>{S.dec[i]=ch;S.why[i]=document.getElementById('why').value.slice(0,400);S.round++;go()};
}
function reveal(){
  const sc=SC[S.k],dl=deadline(),s=stats(S.k,LAST);
  const truth={A:0,B:0.06,C:0,D:0.12,E:-0.08,F:undefined}[S.k];
  const stop=S.dec.findIndex(x=>x!=='continuar');
  const rows=S.dec.map((dc,i)=>{const g=sc.good(dc,i),o=sc.ok(dc,i);
    return `<tr><td>Dia ${ROUNDS[i]}</td><td>${DECISIONS.find(x=>x.id===dc).t}${S.why[i]?`<div class="small muted">${esc(S.why[i])}</div>`:''}</td><td><span class="tag ${g?'good':o?'mid':'bad'}">${g?'boa leitura':o?'defensável':'armadilha'}</span><div class="small muted" style="margin-top:4px">${sc.roundNote[i]}</div></td></tr>`}).join('');
  app.innerHTML=`<div class="card"><span class="chip">Teste ${S.k}</span>
   <h1>O que era verdade</h1>
   <p>${sc.truth}</p>
   <div class="verdict ${sc.verdict}"><div class="small muted">Veredito certo (o mesmo da Oficina 4)</div><div class="big">${sc.verdictTxt}</div><p>${sc.verdictWhy}</p></div>
   <p><b>Armadilha deste teste:</b> <span class="mag">${sc.trap}</span></p>
   ${chart(S.k,LAST,{deadline:dl,truth})}
   <div class="legend"><span><i style="background:#e8761c"></i>ganho acumulado de B até o dia ${LAST}</span>${truth!==undefined?'<span><i style="background:#1d8a4e"></i>efeito verdadeiro</span>':''}<span><i style="background:#ed145b"></i>prazo que vocês combinaram</span></div>
   <p class="small muted">No dia ${LAST}: B ${sgn(s.lift)} sobre A, significância ${sigTxt(s.sig)}, divisão ${pct(s.split,0)}/${pct(1-s.split,0)}, reclamações ${dec1(s.qa)} × ${dec1(s.qb)} por mil.</p>
   <h3>Ganho de cada semana</h3>${weekly(S.k,LAST)}
  </div>
  <div class="card"><h2>As decisões do grupo</h2>
   <p class="small muted">${stop>=0?`O grupo encerrou o teste no dia ${ROUNDS[stop]}; o prazo combinado era o dia ${dl}.`:'O grupo não encerrou o teste em nenhuma rodada.'}</p>
   <table><tr><th>Rodada</th><th>Decisão</th><th>Leitura</th></tr>${rows}</table>
   <h3>Para a conversa com a turma</h3>
   <p>Quando vocês pararam, o que o dia seguinte mostrou? E qual pergunta teriam feito ao time antes de decidir?</p>
   <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn ghost" id="again">Recomeçar</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>{S={k:null,effect:null,round:0,dec:[],why:[]};go()};
}
function panel(){
  const truths={A:0,B:0.06,C:0,D:0.12,E:-0.08,F:undefined};
  app.innerHTML=`<div class="card"><h1>Painel do professor</h1><p class="muted">Os seis testes até o dia ${LAST}, para projetar na conversa das 20:27. Não divulgar antes das rodadas.</p></div>
  <div class="grid6">${Object.keys(SC).map(k=>{const sc=SC[k];return `<div class="card"><div class="row"><span class="chip">Teste ${k}</span><span class="spacer"></span><span class="tag ${sc.verdict==='g'?'good':sc.verdict==='f'?'mid':'bad'}">${sc.verdictTxt.split(':')[0]}</span></div>
   <p style="margin-top:8px"><b>${sc.trap}</b></p>${chart(k,LAST,{truth:truths[k]})}
   <p class="small muted">${ROUNDS.map(d=>{const s=stats(k,d);return `dia ${d}: ${sgn(s.lift)} (${sigTxt(s.sig)})`}).join(' · ')}</p></div>`}).join('')}</div>`;
}
load();render();
</script>
</body>
</html>
