<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório A/B</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#e8edef;--paper:#fffdf7;--ink:#14232b;--mute:#52656e;--line:#c3cfd4;--ok:#1f8a5b;--bad:#c23b3b;--wait:#b88312;--idle:#8fa0a8;--a:#3d6fa8;--b:#d9711c;
 --ok-soft:rgba(31,138,91,.12);--bad-soft:rgba(194,59,59,.11);--wait-soft:rgba(184,131,18,.13);--neu-soft:rgba(82,101,110,.10);--sel:rgba(20,35,43,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10191e;--paper:#1a2830;--ink:#e6eef1;--mute:#9db0b8;--line:#2f434d;--ok:#3fc08a;--bad:#ef6b6b;--wait:#e0b24a;--idle:#5f747d;--a:#7fa9dc;--b:#f0974f;--sel:rgba(230,238,241,.08)}}
:root[data-theme=dark]{--bg:#10191e;--paper:#1a2830;--ink:#e6eef1;--mute:#9db0b8;--line:#2f434d;--ok:#3fc08a;--bad:#ef6b6b;--wait:#e0b24a;--idle:#5f747d;--a:#7fa9dc;--b:#f0974f;--sel:rgba(230,238,241,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 40px}
h1,h2,h3{font-family:Rockwell,"Roboto Slab",Georgia,serif;line-height:1.2;margin:0}
h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:6px 0 10px}
h2{font-size:1.25rem;margin:0 0 10px}
h3{font-size:1.02rem;margin:18px 0 6px}
p{margin:0 0 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;margin-bottom:26px}
.brand .mba{display:flex;align-items:center;gap:14px}
.brand .mba i{width:1px;height:34px;background:var(--mute)}
.brand .mba small{display:block;color:var(--mute);font-size:.85rem}
.brand .mba b{display:block;font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:1.1rem}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .brand img{filter:brightness(0) invert(1)}}
:root[data-theme=dark] .brand img{filter:brightness(0) invert(1)}
.theme{background:transparent;border:0;color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;padding:4px 0;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:10px}
.theme .track{position:relative;width:52px;height:30px;border:2px solid var(--ink);border-radius:15px;background:transparent;flex:none}
.theme .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:left .15s}
.theme .st{font-size:.78rem;color:var(--mute);min-width:24px}
.theme[aria-checked=true] .track{background:var(--ink)}
.theme[aria-checked=true] .knob{left:25px;background:var(--paper)}
.brandright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.card{background:var(--paper);border:1px solid var(--line);padding:16px 18px;margin:0 0 16px}
.mission{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--ink);padding:14px 18px;margin:16px 0}
.mission ol{margin:6px 0 0;padding-left:20px}
.muted{color:var(--mute)}
.small{font-size:.86rem}
.mag{color:var(--wait);font-weight:700}
.btn{background:var(--ink);color:var(--paper);border:0;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--wait);outline-offset:2px}
.letters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.letters button{font:700 1.6rem Rockwell,"Roboto Slab",Georgia,serif;padding:14px 0;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.letters button:hover{background:var(--ink);color:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:.94rem;background:var(--paper)}
th,td{padding:8px;border:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:Rockwell,Georgia,serif;font-weight:700}
td.num,th.num{text-align:right}td.num{white-space:nowrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);padding:11px 12px;margin:8px 0;cursor:pointer;background:var(--paper)}
.opt input{margin-top:4px;accent-color:var(--ink);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--ink);background:var(--sel)}
.opt b{display:block}
.progress{height:8px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);padding:10px 12px;border-top:4px solid var(--idle)}
.kpi.a{border-top-color:var(--a)} .kpi.b{border-top-color:var(--b)}
.kpi .lab{font-size:.85rem;color:var(--mute);font-weight:600}
.kpi .val{font-size:1.6rem;font-weight:700}
.kpi.a .val{color:var(--a)} .kpi.b .val{color:var(--b)}
.tool{padding:12px 14px;margin:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-left:6px solid var(--idle)}
.tool .big{font-size:1.35rem;font-weight:700}
.tool.ok{background:var(--ok-soft);border-color:var(--ok)} .tool.ok .big{color:var(--ok)}
.tool.bad{background:var(--bad-soft);border-color:var(--bad)} .tool.bad .big{color:var(--bad)}
.tool.neu{background:var(--neu-soft)}
.chip{display:inline-block;padding:2px 10px;font-size:.82rem;font-weight:600;border:1px solid var(--ink)}
.boss{background:var(--paper);border:2px dashed var(--wait);padding:10px 14px;margin:12px 0}
.boss .who{font-weight:700;color:var(--wait);font-size:.82rem;text-transform:uppercase;letter-spacing:.4px}
textarea{width:100%;min-height:72px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px;resize:vertical}
.chart{width:100%;max-width:620px;height:auto;display:block;margin:8px auto 0}
.legend{max-width:620px;margin-left:auto;margin-right:auto}
#hint{font-size:.84rem;color:var(--mute)}
details summary{cursor:pointer;color:var(--mute);font-size:.88rem}
@media(max-width:480px){.brand{margin-bottom:14px;gap:10px}.brand>img{width:84px;height:auto}.brand .mba img{height:26px}.brand .mba small{font-size:.76rem}.brand .mba b{font-size:.95rem}}
.chart text{fill:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:middle}
.verdict{padding:14px;margin:12px 0;border-left:6px solid}
.verdict.g{background:var(--ok-soft);border-color:var(--ok)} .verdict.p{background:var(--bad-soft);border-color:var(--bad)} .verdict.f{background:var(--wait-soft);border-color:var(--wait)}
.verdict .big{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:1.35rem;font-weight:700}
.tag{font-size:.78rem;font-weight:700;padding:1px 6px;white-space:nowrap;border:1px solid}
.tag.good{color:var(--ok)} .tag.bad{color:var(--bad)} .tag.mid{color:var(--wait)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
body.print .brand,body.print .note{display:none}
.resumo table{font-size:.86rem}.resumo td{padding:6px}.resumo .small{font-size:.82rem}
.note{color:var(--mute);font-size:.88rem;margin-top:24px}
.grid6{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media(max-width:420px){.kpi .val{font-size:1.35rem}.tool .big{font-size:1.15rem}.brand .mba b{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- estatística (o aluno não calcula; a ferramenta mostra) ---------- */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
function ncdf(z){return 0.5*(1+erf(z/Math.SQRT2))}
function cum(k, d){const r=[0,0,0,0,0,0];for(let i=0;i<d;i++){for(let j=0;j<6;j++)r[j]+=DATA[k][i][j]}return r}
function stats(k, d, from){
  let r;
  if(from){const a=cum(k,d),b=cum(k,from);r=a.map((v,i)=>v-b[i])}else r=cum(k,d);
  const [ta,ca,tb,cb,qa,qb]=r;const pa=ca/ta,pb=cb/tb;
  const se=Math.sqrt(pa*(1-pa)/ta+pb*(1-pb)/tb);const z=(pb-pa)/se;const p=2*(1-ncdf(Math.abs(z)));
  return {ta,ca,tb,cb,pa,pb,lift:pb/pa-1,lo:(pb-pa-1.96*se)/pa,hi:(pb-pa+1.96*se)/pa,sig:1-p,
    split:ta/(ta+tb),qa:qa/ta*1000,qb:qb/tb*1000};
}
const pct=(x,dig=1)=>(x*100).toLocaleString('pt-BR',{minimumFractionDigits:dig,maximumFractionDigits:dig})+'%';
const sgn=(x,dig=1)=>(x>0?'+':x<0?'−':'')+pct(Math.abs(x),dig);
const dec1=x=>(Math.round(x*10)/10).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const int=x=>Math.round(x).toLocaleString('pt-BR');
const sigTxt=s=>s>0.999?'> 99,9%':pct(s,0);
function status(s){
  if(s.sig>=0.95&&s.lift>0)return {cls:'ok',txt:'B à frente',sub:'diferença significativa (bateu a meta de 95%)'};
  if(s.sig>=0.95&&s.lift<0)return {cls:'bad',txt:'B atrás',sub:'diferença significativa (bateu a meta de 95%)'};
  return {cls:'neu',txt:'Inconclusivo',sub:'a diferença ainda pode ser acaso'};
}

/* ---------- gráfico ---------- */
function chart(k, upto, opts={}){
  const W=480,H=300,L=60,R=10,T=18,B=44;const days=[];for(let d=2;d<=upto;d++)days.push(d);
  const pts=days.map(d=>({d,...stats(k,d)}));
  let ymin=-0.3,ymax=0.4;
  const x=d=>L+(d-1)/(LAST-1)*(W-L-R);const y=v=>T+(ymax-Math.max(ymin,Math.min(ymax,v)))/(ymax-ymin)*(H-T-B);
  let g='';
  for(let v=-0.3;v<=0.401;v+=0.1){const vv=Math.round(v*10)/10;g+=`<line x1="${L}" x2="${W-R}" y1="${y(vv)}" y2="${y(vv)}" style="stroke:var(${vv===0?'--idle':'--line'})" stroke-width="${vv===0?1.5:1}"/>`;
    g+=`<text x="${L-8}" y="${y(vv)+4}" font-size="16" text-anchor="end" >${vv>0?'+':''}${Math.round(vv*100)}%</text>`}
  for(let d=7;d<=LAST;d+=7){g+=`<line x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H-B}" style="stroke:var(--line);opacity:.5"/><text x="${x(d)}" y="${H-B+18}" font-size="16" text-anchor="middle" >${d}</text>`}
  g+=`<text x="${x(1)}" y="${H-B+18}" font-size="16" text-anchor="middle" >1</text>`;
  if(opts.deadline){g+=`<line x1="${x(opts.deadline)}" x2="${x(opts.deadline)}" y1="${T}" y2="${H-B}" style="stroke:var(--wait)" stroke-dasharray="5 4" stroke-width="2"/><text x="${opts.deadline<=10?x(opts.deadline)+6:x(opts.deadline)-6}" y="${T+12}" font-size="16" text-anchor="${opts.deadline<=10?'start':'end'}" style="fill:var(--wait)" font-weight="bold">prazo do grupo</text>`}
  const band='M'+pts.map(p=>`${x(p.d)},${y(p.hi)}`).join('L')+'L'+pts.slice().reverse().map(p=>`${x(p.d)},${y(p.lo)}`).join('L')+'Z';
  g+=`<path d="${band}" style="fill:var(--b);opacity:.18"/>`;
  g+=`<path d="M${pts.map(p=>`${x(p.d)},${y(p.lift)}`).join('L')}" fill="none" style="stroke:var(--b)" stroke-width="3"/>`;
  if(opts.today){const p=pts[pts.length-1];g+=`<circle cx="${x(p.d)}" cy="${y(p.lift)}" r="5.5" style="fill:var(--b);stroke:var(--paper)" stroke-width="2"/><text x="${x(p.d)+8}" y="${y(p.lift)-8}" font-size="17" font-weight="bold" style="fill:var(--ink)">hoje</text>`}
  if(opts.truth!==undefined){g+=`<line x1="${L}" x2="${W-R}" y1="${y(opts.truth)}" y2="${y(opts.truth)}" style="stroke:var(--ok)" stroke-width="2.5" stroke-dasharray="3 4"/>`}
  g+=`<text x="${L}" y="${H-6}" font-size="16" >dia do teste</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico do ganho de B sobre A, somando do dia 1 em diante">${g}</svg>`;
}
function weekly(k, upto){
  const weeks=Math.floor(upto/7);if(weeks<1)return '<p class="small muted">O ganho de cada semana aparece quando a 1ª semana fechar.</p>';
  let rows='';for(let w=1;w<=weeks;w++){const s=stats(k,w*7,(w-1)*7);rows+=`<tr><td>Semana ${w}</td><td class="num">${sgn(s.lift)}</td><td class="num">${dec1(s.qa)} × ${dec1(s.qb)}</td></tr>`}
  return `<table><tr><th>Semana</th><th class="num">Ganho de B só nessa semana</th><th class="num">Reclamações por mil (A × B)</th></tr>${rows}</table>`;
}

function deadline(){return EFFECTS.find(e=>e.id===S.effect).days}

   <p><b>Armadilha deste teste:</b> <span class="mag">${sc.trap}</span></p>
   ${chart(S.k,LAST,{deadline:dl,truth})}
   <div class="legend"><span><i style="background:var(--b)"></i>ganho de B somando do dia 1 ao dia ${LAST}</span>${truth!==undefined?'<span><i style="background:var(--ok)"></i>ganho verdadeiro (o que a simulação sabe)</span>':''}<span><i style="background:var(--wait)"></i>prazo definido pelo grupo (dia ${dl})</span></div>
   <p class="small muted">No dia ${LAST}: B ${sgn(s.lift)} sobre A, significância ${sigTxt(s.sig)}, divisão ${pct(s.split,0)}/${pct(1-s.split,0)}, reclamações ${dec1(s.qa)} × ${dec1(s.qb)} por mil.</p>
   <h3>Ganho de cada semana, separado</h3>${weekly(S.k,LAST)}
  </div>
  <div class="card"><h2>As decisões do grupo</h2>
   <p class="small muted">${stop>=0?`O grupo encerrou o teste no dia ${ROUNDS[stop]}. Prazo definido pelo grupo: ${prazoTxt()}.`:`O grupo não encerrou o teste em nenhuma rodada. Prazo definido pelo grupo: ${prazoTxt()}.`}</p>
   <table><tr><th>Rodada</th><th>Decisão e porquê</th><th>Avaliação</th></tr>${rows}</table>
   <h3>Para a conversa com a turma</h3>
   <p>Quando vocês pararam, o que o dia seguinte mostrou? E qual pergunta teriam feito ao time antes de decidir?</p>
   <div class="row" style="margin-top:10px"><button class="btn ghost" id="again">Recomeçar</button><span class="spacer"></span><button class="btn" id="toresumo">Ver o resumo do grupo para print</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>{S={k:null,effect:null,round:0,dec:[],why:[]};go()};
  document.getElementById('toresumo').onclick=document.getElementById('toresumo2').onclick=()=>{S.resumo=true;go()};
}
function resumo(){
  const sc=SC[S.k];
  const rows=S.dec.map((dc,i)=>{const g=sc.good(dc,i),o=sc.ok(dc,i);
    return `<tr><td class="num"><b>Dia ${ROUNDS[i]}</b></td><td><b>${DECISIONS.find(x=>x.id===dc).t}</b>${S.why[i]?`<div class="small">${esc(S.why[i])}</div>`:'<div class="small muted">(sem porquê anotado)</div>'}</td><td><span class="tag ${g?'good':o?'mid':'bad'}">${g?'boa leitura':o?'defensável':'armadilha'}</span></td></tr>`}).join('');
  app.innerHTML=`<div class="card resumo">
   <div class="row"><span class="chip">Teste ${S.k}</span><span class="chip">Resumo do grupo</span><span class="spacer"></span><span class="small muted">Growth Hacking · Lab A/B</span></div>
   <p class="small" style="margin:10px 0 6px">${sc.context}</p>
   <p class="small" style="margin:0 0 10px"><b>Prazo definido pelo grupo:</b> ${prazoTxt()}</p>
   <table>${rows}</table>
   <div class="verdict ${sc.verdict}" style="margin:12px 0 0;padding:10px 12px"><div class="small muted">Veredito certo</div><div class="big" style="font-size:1.1rem">${sc.verdictTxt}</div><div class="small">Armadilha: ${sc.trap}</div></div>
  </div>
  <p class="small muted">Tirem um print desta tela: ela não fica salva em nenhum lugar fora deste celular.</p>
  <div class="row"><button class="btn ghost" id="back">Voltar ao que era verdade</button></div>`;
  document.getElementById('back').onclick=()=>{S.resumo=false;go()};
}
function panel(){
  const truths={A:0,B:0.06,C:0,D:0.12,E:-0.08,F:undefined};
  app.innerHTML=`<div class="card"><h1>Painel do professor</h1><p class="muted">Os seis testes até o dia ${LAST}, para projetar na conversa das 20:27. Não divulgar antes das rodadas.</p></div>
  <div class="grid6">${Object.keys(SC).map(k=>{const sc=SC[k];return `<div class="card"><div class="row"><span class="chip">Teste ${k}</span><span class="spacer"></span><span class="tag ${sc.verdict==='g'?'good':sc.verdict==='f'?'mid':'bad'}">${sc.verdictTxt.split(':')[0]}</span></div>
   <p style="margin-top:8px"><b>${sc.trap}</b></p>${chart(k,LAST,{truth:truths[k]})}
   <p class="small muted">${ROUNDS.map(d=>{const s=stats(k,d);return `dia ${d}: ${sgn(s.lift)} (${sigTxt(s.sig)})`}).join(' · ')}</p></div>`}).join('')}</div>`;
}
/* ---------- modo claro / escuro ---------- */
(function(){
  const root=document.documentElement,btn=document.getElementById('theme');
  let saved=null;try{saved=localStorage.getItem('labab-tema')}catch(e){}
  if(saved==='light'||saved==='dark')root.setAttribute('data-theme',saved);
  const isDark=()=>root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const label=()=>{const d=isDark();btn.setAttribute('aria-checked',d?'true':'false');document.getElementById('themest').textContent=d?'On':'Off'};
  btn.onclick=()=>{const v=isDark()?'light':'dark';root.setAttribute('data-theme',v);try{localStorage.setItem('labab-tema',v)}catch(e){}label()};
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',label)}catch(e){}
  label();
})();
load();render();
</script>
</body>
</html>
